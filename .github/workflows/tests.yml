name: CI Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Testing against modern Python versions supported by PySide6
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system-level Qt and XCB dependencies
      # This action automatically handles the complex list of required libraries 
      # for Qt6/PySide6 on Ubuntu (libxkbcommon, libxcb, etc.)
      uses: tlambert03/setup-qt-libs@v1

    - name: Install additional X11 utilities
      # Required for simulated UI events like focus and clicks to process correctly 
      # in a virtual framebuffer
      run: |
        sudo apt-get update
        sudo apt-get install -y x11-utils libxkbcommon-x11-0 xvfb

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        # Install project and dev dependencies (including beautifulsoup4, selenium, pytest plugins)
        pip install -e ".[dev]"

    - name: Run Headless GUI Tests
      env:
        # Force PySide6 to avoid auto-detection variances
        PYTEST_QT_API: pyside6
        # Optional: Set offscreen platform if not using pytest-xvfb
        # QT_QPA_PLATFORM: offscreen
      run: |
        # pytest-xvfb will automatically start a virtual framebuffer for these tests
        pytest tests/ --verbose --ignore=ref
